# P4-2: Dependabot 依赖自动更新（商用安全实践）
# - Maven: 每周一检查 java 依赖（pom.xml）
# - GitHub Actions: 每周一检查 CI 工作流依赖
# - 归组策略（2026-09-02 加）：同类依赖合并到 1 个 PR，避免「分支爆炸」
#   之前每个过期依赖单独开 1 个 PR + 1 个分支，几个月堆出 11+ 个；
#   加 groups 后每周最多 3 个 PR/分支（platform-maven / core-maven / ci-actions）
# 安全漏洞（Dependabot security alerts）不在此配置内，GitHub 自动扫描
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/java-agent-platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "maven"
    groups:
      platform-maven-deps:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/java-agent-core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "maven"
    groups:
      core-maven-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    groups:
      ci-actions:
        patterns:
          - "*"
