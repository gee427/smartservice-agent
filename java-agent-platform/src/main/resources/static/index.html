<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartService AI 助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <span class="logo">SS</span>
        <div>
          <h1>SmartService AI 助手</h1>
          <p class="subtitle">本地部署 · 多 Agent 路由 · 流式输出</p>
        </div>
      </div>
      <button id="btnClear" class="btn-ghost" title="清空当前会话">清空会话</button>
    </header>

    <main id="chatArea" class="chat-area">
      <div class="welcome">
        <div class="welcome-icon">AI</div>
        <h2>您好，我是 SmartService AI 助手</h2>
        <p>聊天、写作、翻译、编程、知识问答……都可以直接问我；需要查天气或算数时，我会自动调用对应的工具。</p>
        <div class="suggestions">
          <button class="chip" data-msg="北京今天天气怎么样？">🌤 查天气</button>
          <button class="chip" data-msg="帮我算一下 15*23+8 等于多少">🧮 算一算</button>
          <button class="chip" data-msg="写一首关于秋天的短诗">✍️ 写诗</button>
          <button class="chip" data-msg="把「你好，世界」翻译成英文">🌐 翻译</button>
        </div>
      </div>
    </main>

    <footer class="input-bar">
      <input id="inputBox" type="text" placeholder="输入你的问题，回车发送…" autocomplete="off">
      <button id="btnSend" class="btn-primary">发送</button>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
