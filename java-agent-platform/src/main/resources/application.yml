# =====================================================================
# P4-1: 多环境配置（商用规范）
# 公共配置层 —— 所有环境共享；环境差异放 application-{profile}.yml
# 激活方式：
#   dev   : mvn spring-boot:run -Dspring-boot.run.profiles=dev   （默认，可不带）
#   test  : 由 pom.xml surefire 自动注入（mvn verify 时生效）
#   prod  : java -jar app.jar --spring.profiles.active=prod
# =====================================================================
spring:
  application:
    name: java-agent-platform
  profiles:
    default: dev          # 未显式指定时默认 dev（本地开发零配置）

  # 静态资源禁止缓存：开发期改 HTML/JS/CSS 无需硬刷即可生效。
  # 仅覆盖 HTML/JS/CSS 等文本资源（Content-Type 匹配），不缓存策略对图片/字体无效——它们仍按默认缓存。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

  # spring-ai starter 自动配置需要 api-key 非空（项目实际用自建 LlmClient 走 agent.llm.*）
  # 生产环境可用环境变量覆盖（OPENAI_API_KEY / LLM_BASE_URL）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-needed}
      base-url: ${LLM_BASE_URL:http://localhost:1234/v1}
      chat:
        options:
          model: ${LLM_MODEL:qwen3vl-8b-uncensored-hauhaucs-aggressive}
          temperature: ${LLM_TEMPERATURE:0.7}
          max-tokens: ${LLM_MAX_TOKENS:2000}

# Actuator 配置（P3-6: 监控端点独立端口 9090，仅本机监听）
management:
  server:
    port: 9090            # 监控端点独立端口，与业务端口(8080)隔离
    address: 127.0.0.1    # 仅本机监听；生产环境由网络层/反向代理控制暴露
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# 自定义配置（环境无关的公共项）
agent:
  session:
    ttl-hours: 24
    max-history: 10
  workflow:
    max-rounds: 5
  router:
    fallback-agent: FAQAgent
  rate-limit:
    # P2-2: 固定窗口限流（按客户端 IP，60s 窗口），超限返回 42900
    enabled: true
    chat-per-minute: 10      # 对话接口（防刷 LLM 成本）
    login-per-minute: 5      # 认证接口（防爆破）
